<title>シムトップス i-Reporter Dashboard (v2)</title>
<style>
:root{--ink:#1b1f2a;--ink2:#4a5262;--ink3:#8b93a3;--line:#e3e6ec;--bg:#f6f7f9;--blue:#0017c1;--err:#c62828}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;padding:24px}
.gate{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:34px 32px 28px;box-shadow:0 10px 34px rgba(20,30,60,.08)}
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin-bottom:10px}
h1{font-size:17px;line-height:1.55;margin:0 0 6px;letter-spacing:.01em}
.sub{font-size:11.5px;color:var(--ink3);margin:0 0 22px}
label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  background:#fcfcfd;color:var(--ink);min-width:0}
input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,23,193,.09)}
button{font:inherit;font-size:13px;font-weight:700;padding:10px 18px;border:0;border-radius:6px;
  background:var(--blue);color:#fff;cursor:pointer;white-space:nowrap}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.55;cursor:default}
.msg{min-height:18px;font-size:11.5px;margin-top:12px;line-height:1.75}
.msg.err{color:var(--err)}
.msg.info{color:var(--ink3)}
.note{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.9;color:var(--ink3)}
.chk{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:400;color:var(--ink3);margin:12px 0 0;cursor:pointer}
.chk input{flex:none;width:14px;height:14px;margin:0;accent-color:var(--blue);cursor:pointer}
</style>
</head>
<body>
<div class="gate">
  <div class="eyebrow">IDEA LLMO</div>
  <h1>シムトップス i-Reporter Dashboard (v2)</h1>
  <p class="sub">閲覧にはパスワードが必要です</p>
  <form id="f" autocomplete="off">
    <label for="pw">パスワード</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" autofocus placeholder="パスワードを入力">
      <button id="b" type="submit">表示</button>
    </div>
    <label class="chk"><input id="rem" type="checkbox" checked>このブラウザに記憶する（同じPCでは再入力不要）</label>
  </form>
  <div class="msg info" id="m"></div>
  <div class="note">
    本ページは競合比較・戦略情報を含むため、内容を <b>AES-256-GCM</b> で暗号化しています。
    正しいパスワードを入力するまで、ページのソースからも内容は読み取れません。<br>
    「記憶する」をオフにした場合は、同じタブの中だけ保持されます（タブを閉じると再入力が必要です）。
  </div>
</div>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var SK = 'azn-llmo-dash-pw';
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      b = document.getElementById('b'), m = document.getElementById('m'),
      rem = document.getElementById('rem');

  function readStore(){
    try { var v = sessionStorage.getItem(SK); if (v) return v; } catch (e) {}
    try { return localStorage.getItem(SK); } catch (e) {}
    return null;
  }
  function writeStore(pass, persist){
    try { sessionStorage.setItem(SK, pass); } catch (e) {}
    try { if (persist) localStorage.setItem(SK, pass); else localStorage.removeItem(SK); } catch (e) {}
  }
  function clearStore(){
    try { sessionStorage.removeItem(SK); } catch (e) {}
    try { localStorage.removeItem(SK); } catch (e) {}
  }

  function say(t, cls){ m.textContent = t; m.className = 'msg ' + (cls || 'info'); }

  function b64(s){
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  if (!(window.crypto && window.crypto.subtle)) {
    say('このブラウザは復号に必要な WebCrypto に対応していません。Chrome / Edge / Safari / Firefox の最新版でお試しください。', 'err');
    b.disabled = true;
    return;
  }
  if (location.protocol === 'file:') {
    say('ローカルファイル（file://）では WebCrypto が使えません。公開URL経由で開いてください。', 'err');
  }

  async function decrypt(pass){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    return new TextDecoder('utf-8').decode(plain);
  }

  function render(html){
    document.open();
    document.write(html);
    document.close();
  }

  async function attempt(pass, silent){
    if (!pass) { if (!silent) say('パスワードを入力してください。', 'err'); return false; }
    b.disabled = true;
    if (!silent) say('復号しています…');
    try {
      var html = await decrypt(pass);
      writeStore(pass, !!(rem && rem.checked));
      render(html);
      return true;
    } catch (e) {
      b.disabled = false;
      if (!silent) say('パスワードが正しくありません。', 'err');
      clearStore();
      return false;
    }
  }

  f.addEventListener('submit', function(e){ e.preventDefault(); attempt(pw.value, false); });

  /* 既に認証済みなら自動で開く（同一タブ＝sessionStorage / 記憶した場合＝localStorage） */
  var saved = readStore();
  if (saved) { say('復号しています…'); attempt(saved, true); }
})();
</script>
